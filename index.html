 if(!f||!e||!re.test(f)||!re.test(e)||e<f)return alert('Invalid dates');const er=checkLeave(l.nurse,c,f,e,l.id);if(er)return alert(er);l.type=c;l.from=f;l.to=e;const rs=prompt('Reason',l.reason);if(rs!==null)l.reason=rs;notify(`Leave edited: ${nm(l.nurse)} — ${l.type} — ${l.from} to ${l.to} by ${actor()}`,'leave',{ward:NU(l.nurse).ward,ids:[l.nurse]});save();R()}
function lDel(id){if(confirm('Delete this leave?')){const l=db.leaves.find(x=>x.id==id);if(l)notify(`Leave deleted: ${nm(l.nurse)} — ${l.type} — ${l.from} to ${l.to} by ${actor()}`,'leave',{ward:NU(l.nurse).ward,ids:[l.nurse]});db.leaves=db.leaves.filter(l=>l.id!=id);save();R()}}
function leaveAll(){const r=rk(),L2=db.leaves.filter(l=>r!=2||NU(l.nurse).ward==me().ward).slice().reverse();
 return `<div class="card np"><h3>Leave records & status</h3><div class="tw"><table><tr><th>${t('Name')}</th><th>${t('Type')}</th><th>${t('From')}</th><th>${t('To')}</th><th>${t('Days')}</th><th>${t('Status')}</th><th></th></tr>${L2.map(l=>`<tr><td>${esc(nm(l.nurse))}<br><small class="mu">${esc(NU(l.nurse).ward)}</small></td><td>${esc(l.type)}</td><td>${l.from}</td><td>${l.to}</td><td>${dd(l.from,l.to)}</td><td><small>${stg(l)}</small></td><td><button onclick="lEd('${l.id}')">${t('Edit')}</button>${isAd()?` <button class="d" onclick="lDel('${l.id}')">${t('Delete')}</button>`:''}</td></tr>`).join('')}</table></div></div>`}
function leaveRep(){const d=S.ld,r=rk(),base=lFilt(),F=base.filter(l=>!S.lt||l.type==S.lt),ws=[...db.wards,''],mo=(S.lm=='on'?d:today()).slice(0,7);
 const tbl=L2=>`<div class="tw"><table><tr><th>#</th><th>${t('Name')}</th><th>HRIS ID</th><th>${t('Category')}</th><th>${t('Ward')}</th><th>${t('Type')}</th><th>${t('From')}</th><th>${t('To')}</th><th>${t('Days')}</th><th>${t('Reason')}</th><th class="np"></th></tr>
 ${L2.map((l,i)=>{const n=NU(l.nurse);return `<tr><td>${i+1}</td><td>${esc(n.name)}<br><small class="mu">${lsum(n.id,mo)}</small></td><td>${esc(n.hris)}</td><td>${esc(n.cat)}</td><td>${esc(n.ward)}</td><td><span class="tag">${esc(l.type)}</span> ${esc(tn(ty(l.type)))}</td><td>${l.from}</td><td>${l.to}</td><td>${dd(l.from,l.to)}</td><td>${esc(l.reason)}</td><td class="np"><button onclick="lEd('${l.id}')">${t('Edit')}</button>${isAd()?` <button class="d" onclick="lDel('${l.id}')">${t('Delete')}</button>`:''}</td></tr>`}).join('')}</table></div>`;
 return `<div class="card"><h3>${t('Nurses on Leave')} ${S.lm=='on'?'— '+d:''}</h3><div class="row np"><select onchange="S.lm=this.value;R()"><option value="on" ${S.lm=='on'?'selected':''}>On leave on date</option><option value="all" ${S.lm=='all'?'selected':''}>All records</option></select>
 ${S.lm=='on'?`<input type="date" value="${d}" onchange="S.ld=this.value;R()" style="max-width:165px">`:''}
 ${r==2?'':`<select onchange="S.lw=this.value;R()"><option value="">${t('All Wards')}</option>${db.wards.map(w=>`<option ${S.lw==w?'selected':''}>${esc(w)}</option>`).join('')}</select>`}
 <select onchange="S.lg=this.value;R()"><option value="">General list (all ward)</option><option value="w" ${S.lg?'selected':''}>Ward-wise list</option></select>
 <button onclick="print()">🖨 ${t('Print')}</button><button onclick="xls('leave-report',['#',t('Name'),'HRIS ID',t('Category'),t('Ward'),t('Type'),t('From'),t('To'),t('Days'),t('Reason'),'CL left'],F.map((l,i)=>{const n=NU(l.nurse);return [i+1,n.name,n.hris,n.cat,n.ward,l.type,l.from,l.to,dd(l.from,l.to),l.reason,clLeft(n.id,'${mo.slice(0,4)}')]}))">📊 ${t('Export Excel')}</button></div>
 <div class="row np"><button class="${S.lt?'':'on'}" onclick="S.lt='';R()">${t('All')} (${base.length})</button>${db.leaveTypes.map(x=>`<button class="${S.lt==x.c?'on':''}" onclick="S.lt='${esc(x.c)}';R()">${esc(x.c)} (${base.filter(l=>l.type==x.c).length})</button>`).join('')}</div>
 <p class="mu">${ws.filter(w=>F.some(l=>(NU(l.nurse).ward||'')==w)).map(w=>`<b>${esc(w||'—')}</b>: ${F.filter(l=>(NU(l.nurse).ward||'')==w).length}`).join(' · ')||'—'}</p>
 ${S.lg?ws.map(w=>{const x=F.filter(l=>(NU(l.nurse).ward||'')==w);return x.length?`<h4 style="margin:12px 0 4px">Ward: ${esc(w||'—')} (${x.length})</h4>`+tbl(x):''}).join(''):tbl([...F].sort((a,b)=>(NU(a.nurse).ward||'').localeCompare(NU(b.nurse).ward||'')))}</div>`}
function listEd(k,title,flag){return `<div class="card np"><h3>${title}</h3>${db[k].map((x,i)=>`<div class="row"><span class="tag">${esc(x.c)}</span><b style="min-width:160px">${esc(tn(x))}</b>${flag?`<label style="margin:0"><input type="checkbox" style="width:auto" ${x.ne?'checked':''} onchange="db.${k}[${i}].ne=this.checked?1:0;save()"> Nurse self-entry (like CL)</label>`:''}<button onclick="leEd('${k}',${i})">${t('Edit')}</button><button class="d" onclick="leDel('${k}',${i})">${t('Remove')}</button></div>`).join('')}
 <div class="row"><input id="${k}_c" placeholder="Code" style="max-width:90px"><input id="${k}_n" placeholder="Name (English)" style="max-width:190px">${flag?`<label style="margin:0"><input type="checkbox" id="${k}_ne" style="width:auto"> Nurse self-entry</label>`:''}<button class="p" onclick="leAdd('${k}')">${t('Add')}</button></div></div>`}
function leAdd(k){const c=$('#'+k+'_c').value.trim(),n=$('#'+k+'_n').value.trim();if(!c||!n||db[k].some(x=>x.c==c))return alert('Code & name required (unique code)');const o={c,n,bn:''};if($('#'+k+'_ne'))o.ne=$('#'+k+'_ne').checked?1:0;db[k].push(o);save();R()}

/* ---------- ACR ---------- */
function acrV(){const r=rk(),Y=new Date().getFullYear(),yrs=[...Array(8)].map((_,i)=>String(Y-i)),lab=v=>v=='Y'?'<b style="color:var(--pr)">Yes ✔</b>':v=='N'?'<b style="color:var(--dg)">No ✘</b>':'—';
 if(r==1)return `<div class="card"><h3>ACR</h3><table style="min-width:0"><tr><th>Year</th><th>ACR submitted?</th></tr>${yrs.map(y=>`<tr><td>${y}</td><td>${lab(db.acr[y+'|'+S.user.id])}</td></tr>`).join('')}</table></div>`;
 const w=r==2?me().ward:S.ward,P=db.nurses.filter(n=>n.st!='pend'&&(!w||n.ward==w));
 return `<div class="card"><h3>ACR</h3><div class="row np"><select onchange="S.ay=this.value;R()">${yrs.map(y=>`<option ${S.ay==y?'selected':''}>${y}</option>`).join('')}</select>${r==2?'':wsel(1)}<button onclick="xls('ACR-${S.ay}',['#',t('Name'),'HRIS',t('Ward'),'ACR ${S.ay}'],nFilt().map((n,i)=>[i+1,n.name,n.hris,n.ward,{Y:'Yes',N:'No'}[db.acr['${S.ay}|'+n.id]]||'—']))">📊 ${t('Export Excel')}</button></div>
 ${r<3?'<p class="mu">View only. Nursing Supervisor / DNS / Nursing Superintendent update ACR.</p>':''}<div class="tw"><table><tr><th>#</th><th>${t('Name')}</th><th>HRIS</th><th>${t('Ward')}</th><th>ACR ${S.ay}</th></tr>
 ${P.map((n,i)=>{const v=db.acr[S.ay+'|'+n.id]||'';return `<tr><td>${i+1}</td><td>${esc(n.name)}</td><td>${esc(n.hris)}</td><td>${esc(n.ward)}</td><td>${r>=3?`<select onchange="acrSet('${n.id}',this.value)"><option value="">—</option><option value="Y" ${v=='Y'?'selected':''}>Yes</option><option value="N" ${v=='N'?'selected':''}>No</option></select>`:lab(v)}</td></tr>`}).join('')}</table></div></div>`}

/* ---------- complaints ---------- */
const LVN=['','','Nurse Incharge','Nursing Supervisor','Deputy Nursing Superintendent','Nursing Superintendent','Admin'];
function cCard(c){const act=canHandle(c),ad=isAd(),
 body=`<div class="row"><b>${esc(nm(c.by))}</b><span class="mu">${esc(NU(c.by).ward)} · ${c.date}</span><span class="tag">${c.status=='open'?'With: '+LVN[c.lvl]:'Closed'}</span></div><p style="white-space:pre-wrap"><b>${esc(c.subject)}</b><br>${esc(c.text)}</p>${c.log.map(x=>`<p class="mu" style="margin:3px 0">↳ <b>${esc(x.role)} ${esc(x.by)}</b> (${x.act}, ${x.date}): ${esc(x.text)}</p>`).join('')}`+
 (act?`<textarea id="cr_${c.id}" rows="2" placeholder="Reply / action note"></textarea><div class="row" style="margin-top:6px">${c.lvl<5&&!ad?`<button class="p" onclick="cAct('${c.id}','f')">Reply &amp; forward ↑</button>`:''}<button onclick="cAct('${c.id}','c')">${c.lvl>=5||ad?'Final action / Close':'Dismiss (close)'}</button>${ad?`<button class="d" onclick="cDel('${c.id}')">${t('Delete')}</button>`:''}</div>`:ad?`<button class="d" onclick="cDel('${c.id}')">${t('Delete')}</button>`:'');
 return c.status=='closed'?`<details class="card"><summary>✔ ${esc(c.subject)} — ${esc(nm(c.by))} <span class="mu">(closed)</span></summary>${body}</details>`:`<div class="card">${body}</div>`}
function comp(){const a=isAd(),id=a?'':S.user.id,vis=db.complaints.filter(c=>a||c.by==id||canHandle(c)||c.log.some(x=>x.uid==id)).slice().reverse(),inbox=vis.filter(c=>c.by!=id&&canHandle(c)),rest=vis.filter(c=>!inbox.includes(c));
 return (a?'':`<div class="card"><h3>${t('Complaint Box')}</h3><p class="mu" style="font-size:12px">Goes to your Controlling Officer, then upward; the Nursing Superintendent takes the final action.</p><label>${t('Subject')}</label><input id="cs"><label>${t('Details')}</label><textarea id="ct" rows="4"></textarea><button class="p" style="margin-top:10px" onclick="cSend()">${t('Submit')}</button></div>`)+
 (inbox.length?`<h3>📥 Needs your action (${inbox.length})</h3>`+inbox.map(cCard).join(''):'')+`<h3>${t('Complaints')}</h3>`+(rest.map(cCard).join('')||'<p class="mu">—</p>')}
function cSend(){const s=$('#cs').value.trim(),x=$('#ct').value.trim();if(!s||!x)return alert('Fill both');db.complaints.push({id:uid(),by:S.user.id,subject:s,text:x,date:today(),status:'open',lvl:Math.min(rk()+1,6),log:[]});save();R()}
function cAct(id,m){const c=db.complaints.find(x=>x.id==id),v=$('#cr_'+id).value.trim();if(!v)return alert('Write a reply / note first');
 c.log.push({uid:S.user.id,by:isAd()?'':me().name,role:isAd()?'Admin':me().cat,text:v,act:m=='f'?'Forwarded':'Closed',date:today()});if(m=='f')c.lvl=Math.min(c.lvl+1,6);else c.status='closed';save();R()}
function cDel(id){if(confirm('Delete?')){db.complaints=db.complaints.filter(c=>c.id!=id);save();R()}}
/* ---------- admin: news, fields, settings ---------- */
function newsV(){return `<div class="card"><h3>📢 ${t('News Ticker')}</h3><p class="mu">Red scrolling text at the top. Wrap important parts like <b>**this**</b> to make them bold and underlined.</p>
 <textarea id="nt" rows="2" placeholder="e.g. **Urgent:** Meeting tomorrow at 10 AM"></textarea><button class="p" style="margin-top:8px" onclick="newsAdd()">${t('Add')}</button></div>

function fields(){const S2=['Basic',...db.secs];return `<div class="card"><h3>Form tabs (sections)</h3><p class="mu">Add a new tab to the nurse data-entry form, then create new fields inside that tab.</p>

 <p class="mu">D/O (chosen in the Duty Roster): a nurse may take as many D/O days per month as there are Fridays + government holidays in that month. The official Bangladesh 2026 holiday calendar is pre-loaded (shown in the Duty Roster); add or remove dates here:</p><div class="row"><input type="date" id="hd" style="max-width:160px"><input id="hn" placeholder="Holiday name" style="max-width:200px"><button class="p" onclick="holAdd()">${t('Add')}</button></div>

 ${db.hol.map((h,i)=>`<span class="chip">${h.date} ${esc(h.name)}<b onclick="db.hol.splice(${i},1);save();R()">×</b></span>`).join('')||'<p class="mu">No holidays added yet.</p>'}</div>
 ${listEd('attTypes','Attendance Types')}
 <div class="card"><h3>Backup / Restore</h3><p class="mu">Data is saved in this browser — take regular backups.</p><div class="row"><button class="p" onclick="bk()">⬇ Download Backup</button><input type="file" accept=".json" onchange="rs(this)" style="max-width:240px"><button class="d" onclick="if(confirm('Delete ALL data?')){try{localStorage.removeItem('nurseapp')}catch(e){}load();S.user=null;R()}">Reset All</button></div></div>`}
function holAdd(){const d=$('#hd').value;if(!d||db.hol.some(h=>h.date==d))return;db.hol.push({date:d,name:$('#hn').value.trim()});db.hol.sort((a,b)=>a.date.localeCompare(b.date));save();R()}

load();R();
